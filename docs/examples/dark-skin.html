<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark skin — kHtmlEditor example</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/site.css">
  <script src="../dist/khtmleditor.min.js"></script>
</head>
<body>
<header class="page-header page-header--compact">
  <a class="github-link" href="https://github.com/KAStrack/kHtmlEditor" target="_blank" rel="noopener noreferrer">GitHub</a>
  <h1><a href="../index.html"><span>k</span>HtmlEditor</a></h1>
  <p class="tagline">Dark skin</p>
  <div class="header-links">
    <a class="header-link" href="./">All examples</a>
    <a class="header-link" href="../demo/">Demo</a>
    <a class="header-link" href="../guide/getting-started.html">Guide</a>
  </div>
</header>
<div class="container container--narrow">
  <section class="section">
    <div class="card">
      <div class="card-header">
        <div class="card-icon" aria-hidden="true">🌙</div>
        <div>
          <div class="card-title">Dark skin</div>
          <div class="card-desc">The oxide-dark UI skin with the dark content stylesheet.</div>
        </div>
      </div>
      <div class="card-body">
        <textarea id="editor"><h2>Dark mode</h2><p>Set <code>skin: 'oxide-dark'</code> and <code>content_css: 'dark'</code>. Skins are CSS variables, so a custom palette is a few lines of CSS.</p></textarea>
        <div class="section-label" style="margin-top:16px">Output (getContent)</div>
        <pre class="output" id="output" aria-live="polite"></pre>
      </div>
      <div class="card-footer">
        <button class="view-source-btn" aria-expanded="false">
          <svg class="chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2 4L6 8L10 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          View source
        </button>
        <div class="source-block"><pre><code id="source-view"></code></pre></div>
      </div>
    </div>
  </section>
</div>
<footer class="page-footer">
  <p><a href="https://www.kastrack.com" target="_blank" rel="noopener">Sponsored by KAStrack</a></p>
  <p>kHtmlEditor — MIT License — Vanilla JS, zero dependencies.</p>
</footer>
<script src="../assets/site.js"></script>
<script id="example-script">
var cfg = {
  selector: '#editor',
  height: 320,
  skin: 'oxide-dark',
  content_css: 'dark',
  plugins: 'lists link image table code',
  toolbar: 'undo redo | blocks | bold italic | bullist numlist | link image table | code'
};
kHtmlEditor.init(cfg).then(function () { kheDocs.bindOutput('editor', 'output'); });
</script>
<script>
  // Show this page's own init script as the "source".
  (function () {
    var s = document.getElementById('example-script');
    var v = document.getElementById('source-view');
    if (s && v) { v.textContent = s.textContent.replace(/^\n+|\n+$/g, ''); }
  })();
</script>
</body>
</html>
